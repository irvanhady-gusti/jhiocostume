const hariIni = () => {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000)
    .toISOString()
    .slice(0, 10);
};

const tambahHari = (tgl, n) => {
  const d = new Date(tgl + "T00:00:00");
  d.setDate(d.getDate() + n);
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000)
    .toISOString()
    .slice(0, 10);
};

const selisihHari = (a, b) =>
  Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);

const durasi = (a, b) => Math.max(1, selisihHari(a, b));

const tglPanjang = (s) => {
  if (!s) return "-";
  return new Date(s + "T00:00:00").toLocaleDateString("id-ID", {
    weekday: "short",
    day: "numeric",
    month: "short",
    year: "numeric",
  });
};

const tglPendek = (s) => {
  if (!s) return "-";

  });
};

/* Foto dikecilkan dulu supaya muat di penyimpanan HP */
const kompresGambar = (berkas, maks = 1100, mutu = 0.62) =>
  new Promise((selesai, gagal) => {
    const pembaca = new FileReader();
    pembaca.onload = () => {
      const gbr = new Image();
      gbr.onload = () => {
        const skala = Math.min(1, maks / Math.max(gbr.width, gbr.height));
        const kanvas = document.createElement("canvas");
        kanvas.width = Math.round(gbr.width * skala);
        kanvas.height = Math.round(gbr.height * skala);
        kanvas.getContext("2d").drawImage(gbr, 0, 0, kanvas.width, kanvas.height);
        selesai(kanvas.toDataURL("image/jpeg", mutu));
      };
      gbr.onerror = () => gagal(new Error("Gambar tidak terbaca"));
      gbr.src = pembaca.result;
    };
    pembaca.onerror = () => gagal(new Error("Berkas tidak terbaca"));
    pembaca.readAsDataURL(berkas);
  });

    "inline-flex items-center justify-center gap-2 rounded-lg px-3.5 py-2 text-sm font-semibold transition-colors motion-reduce:transition-none focus:outline-none focus:ring-2 focus:ring-amber-500 focus:ring-offset-2 disabled:opacity-40";
  const v = {
    primary: "bg-indigo-950 text-amber-50 hover:bg-indigo-900",
    gold: "bg-amber-500 text-indigo-950 hover:bg-amber-400",
    ghost: "bg-transparent text-indigo-950 hover:bg-indigo-950/5",
    outline: "border border-indigo-950/20 bg-white text-indigo-950 hover:bg-indigo-950/5",
    danger: "bg-red-800 text-white hover:bg-red-700",
  }[variant];
  return <button className={`${base} ${v} ${className}`} {...p} />;
};

const Card = ({ className = "", ...p }) => (
  <div className={`rounded-xl border border-indigo-950/10 bg-white ${className}`} {...p} />
);

const Modal = ({ open, onClose, title, sub, children, footer }) => {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-indigo-950/50 p-0 sm:p-4">
      <div className="flex max-h-[92vh] w-full max-w-2xl flex-col overflow-hidden rounded-t-2xl sm:rounded-2xl bg-amber-50 shadow-2xl">
        <div className="flex items-start justify-between gap-4 border-b border-indigo-950/10 bg-white px-5 py-4">
          <div>
            <h2 className="font-serif text-lg leading-tight text-indigo-950">{title}</h2>
            {sub && <p className="mt-0.5 text-xs text-indigo-950/50">{sub}</p>}
          </div>
          <button
            onClick={onClose}
            aria-label="Tutup"
            className="rounded-lg p-1.5 text-indigo-950/50 hover:bg-indigo-950/5 focus:outline-none focus:ring-2 focus:ring-amber-500"
          >
            <X size={18} />
          </button>
        </div>
        <div className="flex-1 overflow-y-auto px-5 py-4">{children}</div>
        {footer && (
          <div className="flex justify-end gap-2 border-t border-indigo-950/10 bg-white px-5 py-3">
            {footer}
          </div>
        )}
      </div>
    </div>
  );
};

const Kosong = ({ icon: Icon, judul, pesan, aksi }) => (
  <div className="flex flex-col items-center justify-center rounded-xl border border-dashed border-indigo-950/20 px-6 py-14 text-center">
    <Icon size={26} className="text-indigo-950/25" />
    <p className="mt-3 font-serif text-base text-indigo-950">{judul}</p>
    <p className="mt-1 max-w-xs text-sm text-indigo-950/50">{pesan}</p>
    {aksi && <div className="mt-4">{aksi}</div>}
  </div>
);

const Pill = ({ tone = "netral", children }) => {
  const t = {
    netral: "bg-indigo-950/5 text-indigo-950/70",
    emas: "bg-amber-500/20 text-amber-800",
    hijau: "bg-emerald-600/10 text-emerald-800",
    merah: "bg-red-700/10 text-red-800",
    nila: "bg-indigo-950 text-amber-50",
  }[tone];
  return (
    <span className={`inline-flex items-center rounded-full px-2 py-0.5 text-[11px] font-semibold ${t}`}>
      {children}
    </span>
  );
};

const tombolFoto =
  "inline-flex cursor-pointer items-center justify-center gap-2 rounded-lg border border-indigo-950/20 bg-white px-3.5 py-2 text-sm font-semibold text-indigo-950 hover:bg-indigo-950/5 focus-within:ring-2 focus-within:ring-amber-500";

function FotoKTP({ foto, onGanti, setToast }) {
  const [sibuk, setSibuk] = useState(false);

  const ambil = async (e) => {
    const berkas = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!berkas) return;
    setSibuk(true);
    try {
      onGanti(await kompresGambar(berkas));
      setToast("Foto KTP tersimpan di HP ini");
    } catch (err) {
      setToast("Foto gagal diproses, coba ambil ulang");
    } finally {
      setSibuk(false);
    }
  };

  if (foto)
    return (
      <div className="overflow-hidden rounded-lg border border-indigo-950/15 bg-white">
        <img src={foto} alt="Jaminan KTP penyewa" className="max-h-56 w-full object-contain bg-indigo-950/5" />
        <div className="flex items-center justify-between gap-2 border-t border-indigo-950/10 px-3 py-2">
          <span className="text-[11px] text-indigo-950/50">Tersimpan di HP ini saja</span>
          <button
            type="button"
            onClick={() => onGanti(null)}
            className="rounded-lg px-2 py-1 text-xs font-semibold text-red-800 hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-amber-500"
          >
            Hapus foto
          </button>
        </div>
      </div>
    );

  return (
    <div className="flex flex-wrap gap-2">
      <label className={tombolFoto}>
        <Camera size={15} /> {sibuk ? "Memproses…" : "Foto KTP"}
        <input type="file" accept="image/*" capture="environment" onChange={ambil} className="sr-only" />
      </label>
      <label className={tombolFoto}>
        <Galeri size={15} /> Ambil dari galeri
        <input type="file" accept="image/*" onChange={ambil} className="sr-only" />
      </label>
    </div>
  );
}

/* Aplikasi                                                            */
/* ------------------------------------------------------------------ */

function App() {
  const [tab, setTab] = useState("beranda");
  const [data, setData] = useState(SEED);
  const [siap, setSiap] = useState(false);
  const [toast, setToast] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const r = localStorage.getItem(KEY);
        if (r) setData({ ...SEED, ...JSON.parse(r) });
      } catch (e) {
        /* belum ada data tersimpan — pakai contoh */
      }
      setSiap(true);
    })();
  }, []);

  useEffect(() => {
    if (!siap) return;
    try { localStorage.setItem(KEY, JSON.stringify(data)); }
    catch (e) { setToast("Penyimpanan HP penuh. Hapus foto KTP transaksi lama lewat menu Pengembalian."); }
  }, [data, siap]);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 2600);
    return () => clearTimeout(t);
  }, [toast]);

  const { costumes, customers, rentals, settings } = data;
  const set = (patch) => setData((d) => ({ ...d, ...patch }));

  /* --- turunan --------------------------------------------------- */

  const aktif = useMemo(
    () => rentals.filter((r) => r.status === "Booking" || r.status === "Disewa"),
    [rentals]
  );

  const terpakai = useMemo(() => {
    const m = {};
    aktif.forEach((r) => r.items.forEach((i) => (m[i.costumeId] = (m[i.costumeId] || 0) + i.qty)));
    return m;
  }, [aktif]);

  const tersedia = (c) => Math.max(0, c.stok - (terpakai[c.id] || 0));

  const namaPelanggan = (id) => customers.find((c) => c.id === id)?.nama || "Pelanggan umum";

  const telat = (r) =>
    (r.status === "Disewa" || r.status === "Booking") && r.tglKembali < hariIni()
      ? selisihHari(r.tglKembali, hariIni())
      : 0;

  const statusTampil = (r) => (telat(r) > 0 ? "Terlambat" : r.status);

  const tonePill = (s) =>
    ({ Booking: "emas", Disewa: "nila", Selesai: "hijau", Terlambat: "merah", Batal: "netral" }[s] ||
    "netral");

  const P = { data, set, costumes, customers, rentals, settings, tersedia, namaPelanggan, telat, statusTampil, tonePill, setToast, setTab, aktif };

  return (
    <div className="min-h-screen bg-amber-50 text-indigo-950">
      <div className="mx-auto flex max-w-6xl flex-col lg:flex-row">
        {/* Rail navigasi */}
        <aside className="lg:sticky lg:top-0 lg:h-screen lg:w-60 lg:shrink-0 bg-indigo-950 text-amber-50">
          <div className="flex items-center gap-3 px-4 py-4 lg:px-5 lg:py-6">
            <div className="h-9 w-9 shrink-0 rounded-md" style={kain()} />
            <div className="min-w-0">
              <p className="truncate font-serif text-[15px] leading-tight">{settings.namaToko}</p>
              <p className="text-[11px] tracking-wide text-amber-50/50">Kostum adat &amp; seragam profesi</p>
            </div>
          </div>
          <nav className="flex gap-1 overflow-x-auto px-3 pb-3 lg:flex-col lg:overflow-visible lg:px-3 lg:pb-6">
            {NAV.map((n) => {
              const on = tab === n.id;
              return (
                <button
                  key={n.id}
                  onClick={() => setTab(n.id)}
                  className={`flex shrink-0 items-center gap-2.5 rounded-lg px-3 py-2 text-sm font-medium transition-colors motion-reduce:transition-none focus:outline-none focus:ring-2 focus:ring-amber-500 ${
                    on ? "bg-amber-500 text-indigo-950" : "text-amber-50/70 hover:bg-white/10"
                  }`}
                >
                  <n.icon size={17} />
                  {n.label}
                </button>
              );
            })}
          </nav>
        </aside>

        {/* Konten */}
        <main className="min-w-0 flex-1 px-4 py-5 sm:px-6 sm:py-8">
          {tab === "beranda" && <Beranda {...P} />}
          {tab === "katalog" && <Katalog {...P} />}
          {tab === "sewa" && <Penyewaan {...P} />}
          {tab === "kembali" && <Pengembalian {...P} />}
          {tab === "invoice" && <Invoice {...P} />}
          {tab === "pelanggan" && <Pelanggan {...P} />}
          {tab === "jadwal" && <Jadwal {...P} />}
          {tab === "laporan" && <Laporan {...P} />}
          {tab === "pengaturan" && <Pengaturan {...P} />}
        </main>
      </div>

      {toast && (
        <div className="fixed bottom-4 left-1/2 z-[60] -translate-x-1/2 rounded-full bg-indigo-950 px-4 py-2 text-sm font-medium text-amber-50 shadow-lg">
          {toast}
        </div>
      )}
    </div>
  );
}

/* Beranda                                                             */

function Beranda({ costumes, rentals, aktif, tersedia, namaPelanggan, telat, statusTampil, tonePill, setTab }) {
  const t = hariIni();
  const bulan = t.slice(0, 7);

  const pendapatanBulan = rentals
    .filter((r) => r.status === "Selesai" && (r.tglDikembalikan || r.tglSewa).slice(0, 7) === bulan)
    .reduce((a, r) => a + r.total + (r.denda || 0), 0);

  const ambilHariIni = aktif.filter((r) => r.tglSewa === t);
  const kembaliHariIni = aktif.filter((r) => r.tglKembali === t);
  const terlambat = aktif.filter((r) => telat(r) > 0);
  const stokMenipis = costumes.filter((c) => tersedia(c) <= 1);

  const stat = [
    { label: "Sedang disewa", nilai: aktif.length, sub: "transaksi berjalan", icon: ShoppingBag },
    { label: "Pendapatan bulan ini", nilai: rp(pendapatanBulan), sub: "dari transaksi selesai", icon: Wallet },
    { label: "Kostum terdaftar", nilai: costumes.reduce((a, c) => a + c.stok, 0), sub: `${costumes.length} jenis`, icon: Package },
    { label: "Perlu ditagih", nilai: terlambat.length, sub: "lewat jatuh tempo", icon: AlertTriangle },
  ];

  return (
    <div className="space-y-6">
      <Header judul="Beranda" sub={tglPanjang(t)} />

      <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">
        {stat.map((s) => (
          <Card key={s.label} className="p-4">
            <s.icon size={16} className="text-amber-600" />
            <p className="mt-3 font-serif text-xl leading-tight tabular-nums">{s.nilai}</p>
            <p className="mt-1 text-[13px] font-medium">{s.label}</p>
            <p className="text-[11px] text-indigo-950/45">{s.sub}</p>
          </Card>
        ))}
      </div>

      <div className="grid gap-4 lg:grid-cols-2">
        <Card className="p-4">
          <h3 className="font-serif text-base">Diambil hari ini</h3>
          <div className="mt-3 space-y-2">
            {ambilHariIni.length === 0 && <p className="text-sm text-indigo-950/45">Tidak ada pengambilan dijadwalkan.</p>}
            {ambilHariIni.map((r) => (
              <BarisTransaksi key={r.id} r={r} nama={namaPelanggan(r.customerId)} statusTampil={statusTampil} tonePill={tonePill} />
            ))}
          </div>
        </Card>

        <Card className="p-4">
          <h3 className="font-serif text-base">Jatuh tempo hari ini</h3>
          <div className="mt-3 space-y-2">
            {kembaliHariIni.length === 0 && <p className="text-sm text-indigo-950/45">Tidak ada yang jatuh tempo.</p>}
            {kembaliHariIni.map((r) => (
              <BarisTransaksi key={r.id} r={r} nama={namaPelanggan(r.customerId)} statusTampil={statusTampil} tonePill={tonePill} />
            ))}
          </div>
        </Card>
      </div>

      {terlambat.length > 0 && (
        <Card className="border-red-800/25 bg-red-50 p-4">
          <h3 className="flex items-center gap-2 font-serif text-base text-red-900">
            <AlertTriangle size={16} /> Lewat jatuh tempo
          </h3>
          <div className="mt-3 space-y-2">
            {terlambat.map((r) => (
              <div key={r.id} className="flex items-center justify-between gap-3 rounded-lg bg-white px-3 py-2 text-sm">
                <div className="min-w-0">
                  <p className="truncate font-medium">{namaPelanggan(r.customerId)}</p>
                  <p className="font-mono text-[11px] text-indigo-950/50">{r.kode} · jatuh tempo {tglPendek(r.tglKembali)}</p>
                </div>
                <Pill tone="merah">{telat(r)} hari</Pill>
              </div>
            ))}
          </div>
          <Btn variant="outline" className="mt-3" onClick={() => setTab("kembali")}>
            Proses pengembalian <ChevronRight size={15} />
          </Btn>
        </Card>
      )}

      {stokMenipis.length > 0 && (
        <Card className="p-4">
          <h3 className="font-serif text-base">Stok menipis</h3>
          <div className="mt-3 flex flex-wrap gap-2">
            {stokMenipis.map((c) => (
              <span key={c.id} className="inline-flex items-center gap-2 rounded-full border border-indigo-950/10 bg-white px-3 py-1 text-xs">
                <span className="h-3 w-3 rounded-full" style={kain(c.warna)} />
                {c.nama} · sisa {tersedia(c)}
              </span>
            ))}
          </div>
        </Card>
      )}
    </div>
  );
}

const Header = ({ judul, sub, aksi }) => (
  <div className="flex flex-wrap items-end justify-between gap-3">
    <div>
      <h1 className="font-serif text-2xl leading-tight sm:text-3xl">{judul}</h1>
      {sub && <p className="mt-1 text-sm text-indigo-950/50">{sub}</p>}
    </div>
    {aksi}
  </div>
);

const BarisTransaksi = ({ r, nama, statusTampil, tonePill }) => (
  <div className="flex items-center justify-between gap-3 rounded-lg border border-indigo-950/10 px-3 py-2 text-sm">
    <div className="min-w-0">
      <p className="truncate font-medium">{nama}</p>
      <p className="font-mono text-[11px] text-indigo-950/50">
        {r.kode} · {r.items.reduce((a, i) => a + i.qty, 0)} item
      </p>
    </div>
    <Pill tone={tonePill(statusTampil(r))}>{statusTampil(r)}</Pill>
  </div>
);

/* Katalog                                                             */
/* ------------------------------------------------------------------ */

const KOSTUM_BARU = {
  nama: "", kategori: "Nusantara", asal: "", target: "Anak",
  ukuran: "", harga: 50000, deposit: 100000, stok: 1, kondisi: "Baik",
  warna: ["#1e1b4b", "#c9922b", "#7f1d1d"],
};

function Katalog({ costumes, set, tersedia, setToast }) {
  const [q, setQ] = useState("");
  const [kat, setKat] = useState("Semua");
  const [tgt, setTgt] = useState("Semua");
  const [form, setForm] = useState(null);

  const hasil = costumes.filter(
    (c) =>
      (kat === "Semua" || c.kategori === kat) &&
      (tgt === "Semua" || c.target === tgt) &&
      (c.nama + c.asal).toLowerCase().includes(q.toLowerCase())
  );

  const simpan = () => {
    if (!form.nama.trim()) return setToast("Nama kostum belum diisi");
    if (form.id) {
      set({ costumes: costumes.map((c) => (c.id === form.id ? form : c)) });
      setToast("Perubahan tersimpan");
    } else {
      set({ costumes: [{ ...form, id: uid() }, ...costumes] });
      setToast("Kostum ditambahkan");
    }
    setForm(null);
  };

  const hapus = (id) => {
    set({ costumes: costumes.filter((c) => c.id !== id) });
    setForm(null);
    setToast("Kostum dihapus");
  };

  return (
    <div className="space-y-5">
      <Header
        judul="Katalog kostum"
        sub={`${costumes.length} jenis · ${costumes.reduce((a, c) => a + c.stok, 0)} potong`}
        aksi={<Btn onClick={() => setForm({ ...KOSTUM_BARU })}><Plus size={16} /> Tambah kostum</Btn>}
      />

      <div className="flex flex-wrap gap-2">
        <div className="relative min-w-[180px] flex-1">
          <Search size={15} className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-indigo-950/35" />
          <input
            className={inputCls + " pl-9"}
            placeholder="Cari nama atau daerah asal"
            value={q}
            onChange={(e) => setQ(e.target.value)}
          />
        </div>
        <select className={inputCls + " w-auto"} value={kat} onChange={(e) => setKat(e.target.value)}>
          {["Semua", "Nusantara", "Profesi"].map((o) => <option key={o}>{o}</option>)}
        </select>
        <select className={inputCls + " w-auto"} value={tgt} onChange={(e) => setTgt(e.target.value)}>
          {["Semua", "Anak", "Dewasa"].map((o) => <option key={o}>{o}</option>)}
        </select>
      </div>

      {hasil.length === 0 ? (
        <Kosong icon={Shirt} judul="Belum ada yang cocok" pesan="Ubah kata pencarian, atau tambahkan kostum baru ke katalog." aksi={<Btn onClick={() => setForm({ ...KOSTUM_BARU })}><Plus size={16} /> Tambah kostum</Btn>} />
      ) : (
        <div className="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">
          {hasil.map((c) => {
            const sisa = tersedia(c);
            return (
              <Card key={c.id} className="overflow-hidden">
                <div className="h-2.5 w-full" style={kain(c.warna)} />
                <div className="p-4">
                  <div className="flex items-start justify-between gap-2">
                    <div className="min-w-0">
                      <h3 className="font-serif text-[17px] leading-tight">{c.nama}</h3>
                      <p className="mt-0.5 text-xs text-indigo-950/50">{c.asal}</p>
                    </div>
                    <button
                      onClick={() => setForm(c)}
                      aria-label={`Ubah ${c.nama}`}
                      className="rounded-lg p-1.5 text-indigo-950/40 hover:bg-indigo-950/5 focus:outline-none focus:ring-2 focus:ring-amber-500"
                    >
                      <Pencil size={15} />
                    </button>
                  </div>

                  <div className="mt-2.5 flex flex-wrap gap-1.5">
                    <Pill>{c.kategori}</Pill>
                    <Pill>{c.target}</Pill>
                    <Pill tone={sisa === 0 ? "merah" : sisa <= 1 ? "emas" : "hijau"}>
                      {sisa === 0 ? "Habis disewa" : `Tersedia ${sisa}/${c.stok}`}
                    </Pill>
                  </div>

                  <p className="mt-2.5 text-xs text-indigo-950/55">Ukuran: {c.ukuran || "—"}</p>

                  <div className="mt-3 flex items-end justify-between border-t border-indigo-950/10 pt-3">
                    <div>
                      <p className="font-serif text-lg tabular-nums">{rp(c.harga)}</p>
                      <p className="text-[11px] text-indigo-950/45">per hari</p>
                    </div>
                    <div className="text-right">
                      <p className="text-sm tabular-nums">{rp(c.deposit)}</p>
                      <p className="text-[11px] text-indigo-950/45">nilai ganti</p>
                    </div>
                  </div>
                </div>
              </Card>
            );
          })}
        </div>
      )}

      <Modal
        open={!!form}
        onClose={() => setForm(null)}
        title={form?.id ? "Ubah kostum" : "Tambah kostum"}
        sub="Data ini dipakai saat membuat transaksi sewa."
        footer={
          <>
            {form?.id && <Btn variant="danger" onClick={() => hapus(form.id)}><Trash2 size={15} /> Hapus</Btn>}
            <Btn variant="ghost" onClick={() => setForm(null)}>Batal</Btn>
            <Btn variant="gold" onClick={simpan}>Simpan kostum</Btn>
          </>
        }
      >
        {form && (
          <div className="grid gap-3 sm:grid-cols-2">
            <div className="sm:col-span-2">
              <Field label="Nama kostum">
                <input className={inputCls} value={form.nama} onChange={(e) => setForm({ ...form, nama: e.target.value })} placeholder="Kebaya Jawa Sogan" />
              </Field>
            </div>
            <Field label="Kategori">
              <select className={inputCls} value={form.kategori} onChange={(e) => setForm({ ...form, kategori: e.target.value })}>
                <option>Nusantara</option>
                <option>Profesi</option>
              </select>
            </Field>
            <Field label={form.kategori === "Nusantara" ? "Daerah asal" : "Bidang profesi"}>
              <input className={inputCls} value={form.asal} onChange={(e) => setForm({ ...form, asal: e.target.value })} placeholder={form.kategori === "Nusantara" ? "Jawa Tengah" : "Kesehatan"} />
            </Field>
            <Field label="Untuk">
              <select className={inputCls} value={form.target} onChange={(e) => setForm({ ...form, target: e.target.value })}>
                <option>Anak</option>
                <option>Dewasa</option>
              </select>
            </Field>
            <Field label="Ukuran tersedia">
              <input className={inputCls} value={form.ukuran} onChange={(e) => setForm({ ...form, ukuran: e.target.value })} placeholder="4-6 th, 7-9 th" />
            </Field>
            <Field label="Tarif sewa per hari">
              <input type="number" min="0" className={inputCls} value={form.harga} onChange={(e) => setForm({ ...form, harga: +e.target.value })} />
            </Field>
            <Field label="Nilai ganti bila rusak/hilang">
              <input type="number" min="0" className={inputCls} value={form.deposit} onChange={(e) => setForm({ ...form, deposit: +e.target.value })} />
            </Field>
            <Field label="Jumlah potong">
              <input type="number" min="0" className={inputCls} value={form.stok} onChange={(e) => setForm({ ...form, stok: +e.target.value })} />
            </Field>
            <Field label="Kondisi">
              <select className={inputCls} value={form.kondisi} onChange={(e) => setForm({ ...form, kondisi: e.target.value })}>
                <option>Baik</option>
                <option>Perlu cuci</option>
                <option>Perlu perbaikan</option>
                <option>Tidak disewakan</option>
              </select>
            </Field>
            <div className="sm:col-span-2">
              <Label>Warna kain pada kartu</Label>
              <div className="flex items-center gap-3">
                {form.warna.map((w, i) => (
                  <input
                    key={i}
                    type="color"
                    value={w}
                    aria-label={`Warna ${i + 1}`}
                    onChange={(e) => {
                      const warna = [...form.warna];
                      warna[i] = e.target.value;
                      setForm({ ...form, warna });
                    }}
                    className="h-9 w-12 cursor-pointer rounded border border-indigo-950/15 bg-white p-0.5"
                  />
                ))}
                <div className="h-9 flex-1 rounded-md" style={kain(form.warna)} />
              </div>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

/* Penyewaan                                                           */

function Penyewaan({ rentals, costumes, customers, set, tersedia, namaPelanggan, statusTampil, tonePill, setToast, settings }) {
  const [buka, setBuka] = useState(false);
  const [filter, setFilter] = useState("Berjalan");
  const [detail, setDetail] = useState(null);

  const daftar = rentals
    .filter((r) =>
      filter === "Semua" ? true : filter === "Berjalan" ? r.status === "Booking" || r.status === "Disewa" : r.status === filter
    )
    .sort((a, b) => (a.tglSewa < b.tglSewa ? 1 : -1));

  const ubahStatus = (r, status) => {
    set({ rentals: rentals.map((x) => (x.id === r.id ? { ...x, status } : x)) });
    setDetail(null);
    setToast(status === "Disewa" ? "Kostum ditandai sudah diambil" : `Transaksi ${status.toLowerCase()}`);
  };

  return (
    <div className="space-y-5">
      <Header
        judul="Penyewaan"
        sub="Catat pesanan, ambil kostum, dan lunasi pembayaran"
        aksi={<Btn onClick={() => setBuka(true)}><Plus size={16} /> Sewa baru</Btn>}
      />

      <div className="flex gap-1.5 overflow-x-auto pb-1">
        {["Berjalan", "Booking", "Disewa", "Selesai", "Batal", "Semua"].map((f) => (
          <button
            key={f}
            onClick={() => setFilter(f)}
            className={`shrink-0 rounded-full px-3 py-1.5 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-amber-500 ${
              filter === f ? "bg-indigo-950 text-amber-50" : "bg-white border border-indigo-950/10 text-indigo-950/60"
            }`}
          >
            {f}
          </button>
        ))}
      </div>

      {daftar.length === 0 ? (
        <Kosong icon={ShoppingBag} judul="Belum ada transaksi di sini" pesan="Buat transaksi sewa baru untuk mulai mencatat pesanan pelanggan." aksi={<Btn onClick={() => setBuka(true)}><Plus size={16} /> Sewa baru</Btn>} />
      ) : (
        <div className="space-y-2.5">
          {daftar.map((r) => (
            <Card key={r.id} className="p-4">
              <div className="flex flex-wrap items-start justify-between gap-3">
                <div className="min-w-0">
                  <div className="flex items-center gap-2">
                    <span className="font-mono text-xs text-indigo-950/50">{r.kode}</span>
                    <Pill tone={tonePill(statusTampil(r))}>{statusTampil(r)}</Pill>
                  </div>
                  <h3 className="mt-1 font-serif text-[17px] leading-tight">{namaPelanggan(r.customerId)}</h3>
                  <p className="mt-1 text-xs text-indigo-950/55">
                    {tglPendek(r.tglSewa)} → {tglPendek(r.tglKembali)} · {durasi(r.tglSewa, r.tglKembali)} hari ·{" "}
                    {r.items.reduce((a, i) => a + i.qty, 0)} potong
                  </p>
                  <p className="mt-1.5 truncate text-xs text-indigo-950/45">
                    {r.items.map((i) => `${i.nama} ×${i.qty}`).join(", ")}
                  </p>
                </div>
                <div className="text-right">
                  <p className="font-serif text-lg tabular-nums">{rp(r.total + (r.denda || 0))}</p>
                  <button
                    onClick={() => setDetail(r)}
                    className="mt-1 text-xs font-semibold text-amber-700 hover:underline focus:outline-none focus:ring-2 focus:ring-amber-500 rounded"
                  >
                    Lihat nota
                  </button>
                </div>
              </div>
            </Card>
          ))}
        </div>
      )}

      <FormSewa
        open={buka}
        onClose={() => setBuka(false)}
        costumes={costumes}
        customers={customers}
        rentals={rentals}
        set={set}
        tersedia={tersedia}
        setToast={setToast}
      />

      <Modal
        open={!!detail}
        onClose={() => setDetail(null)}
        title="Nota sewa"
        sub={detail?.kode}
        footer={
          detail && (
            <>
              {detail.status === "Booking" && (
                <>
                  <Btn variant="ghost" onClick={() => ubahStatus(detail, "Batal")}>Batalkan</Btn>
                  <Btn variant="gold" onClick={() => ubahStatus(detail, "Disewa")}><Check size={15} /> Kostum diambil</Btn>
                </>
              )}
              {detail.status !== "Booking" && <Btn variant="ghost" onClick={() => setDetail(null)}>Tutup</Btn>}
            </>
          )
        }
      >
        {detail && <Nota r={detail} nama={namaPelanggan(detail.customerId)} settings={settings} />}
      </Modal>
    </div>
  );
}

function FormSewa({ open, onClose, costumes, customers, rentals, set, tersedia, setToast }) {
  const kosong = {
    customerId: customers[0]?.id || "",
    pelangganBaru: "",
    hpBaru: "",
    tglSewa: hariIni(),
    tglKembali: tambahHari(hariIni(), 1),
    items: [],
    dp: 0,
    ktpFoto: null,
    ktpCatatan: "",
    catatan: "",
  };
  const [f, setF] = useState(kosong);
  const [q, setQ] = useState("");

  useEffect(() => {
    if (open) { setF({ ...kosong, customerId: customers[0]?.id || "" }); setQ(""); }
    // eslint-disable-next-line
  }, [open]);

  const hari = durasi(f.tglSewa, f.tglKembali);
  const subtotal = f.items.reduce((a, i) => a + i.harga * i.qty, 0) * hari;
  const total = subtotal;
  const sisa = Math.max(0, subtotal - (+f.dp || 0));

  const tambah = (c) => {
    const ada = f.items.find((i) => i.costumeId === c.id);
    const maks = tersedia(c);
    if (maks === 0) return setToast(`${c.nama} sedang habis disewa`);
    if (ada && ada.qty >= maks) return setToast(`Sisa ${c.nama} tinggal ${maks}`);
    setF({
      ...f,
      items: ada
        ? f.items.map((i) => (i.costumeId === c.id ? { ...i, qty: i.qty + 1 } : i))
        : [...f.items, { costumeId: c.id, nama: c.nama, harga: c.harga, deposit: c.deposit, qty: 1 }],
    });
  };

  const kurang = (id) =>
    setF({
      ...f,
      items: f.items.flatMap((i) => (i.costumeId === id ? (i.qty > 1 ? [{ ...i, qty: i.qty - 1 }] : []) : [i])),
    });

  const simpan = () => {
    if (f.items.length === 0) return setToast("Pilih minimal satu kostum");
    if (!f.customerId && !f.pelangganBaru.trim()) return setToast("Isi nama penyewa");
    if (selisihHari(f.tglSewa, f.tglKembali) < 0) return setToast("Tanggal kembali mendahului tanggal ambil");

    let customerId = f.customerId;
    let daftarPelanggan = customers;
    if (f.pelangganBaru.trim()) {
      customerId = uid();
      daftarPelanggan = [...customers, { id: customerId, nama: f.pelangganBaru.trim(), hp: f.hpBaru, alamat: "", jaminan: "KTP", catatan: "" }];
    }

    const nomor = String(rentals.length + 1).padStart(3, "0");
    const baru = {
      id: uid(),
      kode: `SW-${hariIni().replace(/-/g, "").slice(2)}-${nomor}`,
      customerId,
      items: f.items,
      tglSewa: f.tglSewa,
      tglKembali: f.tglKembali,
      tglDikembalikan: null,
      status: f.tglSewa === hariIni() ? "Disewa" : "Booking",
      subtotal,
      total,
      dp: +f.dp || 0,
      ktpFoto: f.ktpFoto,
      ktpCatatan: f.ktpCatatan,
      denda: 0,
      potongan: 0,
      hariTelat: 0,
      catatan: f.catatan,
      dibuat: hariIni(),
    };

    set({ rentals: [baru, ...rentals], customers: daftarPelanggan });
    setToast(`Transaksi ${baru.kode} tersimpan`);
    onClose();
  };

  const hasil = costumes.filter((c) => (c.nama + c.asal).toLowerCase().includes(q.toLowerCase())).slice(0, 8);

  return (
    <Modal
      open={open}
      onClose={onClose}
      title="Transaksi sewa baru"
      sub="Pilih penyewa, tanggal, lalu tambahkan kostum"
      footer={
        <>
          <Btn variant="ghost" onClick={onClose}>Batal</Btn>
          <Btn variant="gold" onClick={simpan}>Simpan transaksi</Btn>
        </>
      }
    >
      <div className="space-y-4">
        <div className="grid gap-3 sm:grid-cols-2">
          <Field label="Penyewa terdaftar">
            <select className={inputCls} value={f.customerId} onChange={(e) => setF({ ...f, customerId: e.target.value, pelangganBaru: "" })}>
              <option value="">— Penyewa baru —</option>
              {customers.map((c) => <option key={c.id} value={c.id}>{c.nama}</option>)}
            </select>
          </Field>
          {!f.customerId && (
            <>
              <Field label="Nama penyewa baru">
                <input className={inputCls} value={f.pelangganBaru} onChange={(e) => setF({ ...f, pelangganBaru: e.target.value })} placeholder="Nama lengkap" />
              </Field>
              <Field label="Nomor HP">
                <input className={inputCls} value={f.hpBaru} onChange={(e) => setF({ ...f, hpBaru: e.target.value })} placeholder="0812-..." />
              </Field>
            </>
          )}
          <Field label="Tanggal diambil">
            <input type="date" className={inputCls} value={f.tglSewa} onChange={(e) => setF({ ...f, tglSewa: e.target.value })} />
          </Field>
          <Field label="Tanggal dikembalikan">
            <input type="date" className={inputCls} value={f.tglKembali} onChange={(e) => setF({ ...f, tglKembali: e.target.value })} />
          </Field>
        </div>

        <div>
          <Label>Tambahkan kostum</Label>
          <div className="relative">
            <Search size={15} className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-indigo-950/35" />
            <input className={inputCls + " pl-9"} placeholder="Ketik nama kostum" value={q} onChange={(e) => setQ(e.target.value)} />
          </div>
          <div className="mt-2 grid gap-1.5 sm:grid-cols-2">
            {hasil.map((c) => (
              <button
                key={c.id}
                onClick={() => tambah(c)}
                disabled={tersedia(c) === 0}
                className="flex items-center gap-2.5 rounded-lg border border-indigo-950/10 bg-white px-3 py-2 text-left text-sm hover:border-amber-500 disabled:opacity-40 focus:outline-none focus:ring-2 focus:ring-amber-500"
              >
                <span className="h-7 w-7 shrink-0 rounded" style={kain(c.warna)} />
                <span className="min-w-0 flex-1">
                  <span className="block truncate font-medium">{c.nama}</span>
                  <span className="block text-[11px] text-indigo-950/50">{rp(c.harga)}/hari · sisa {tersedia(c)}</span>
                </span>
                <Plus size={15} className="text-amber-600" />
              </button>
            ))}
          </div>
        </div>

        {f.items.length > 0 && (
          <div className="rounded-lg border border-indigo-950/10 bg-white p-3">
            <Label>Keranjang</Label>
            <div className="space-y-2">
              {f.items.map((i) => (
                <div key={i.costumeId} className="flex items-center justify-between gap-3 text-sm">
                  <span className="min-w-0 flex-1 truncate">{i.nama}</span>
                  <span className="tabular-nums text-xs text-indigo-950/50">{rp(i.harga)}</span>
                  <span className="flex items-center gap-1.5">
                    <button onClick={() => kurang(i.costumeId)} aria-label="Kurangi" className="rounded border border-indigo-950/15 p-1 hover:bg-indigo-950/5 focus:outline-none focus:ring-2 focus:ring-amber-500"><Minus size={13} /></button>
                    <span className="w-5 text-center tabular-nums">{i.qty}</span>
                    <button onClick={() => tambah(costumes.find((c) => c.id === i.costumeId))} aria-label="Tambah" className="rounded border border-indigo-950/15 p-1 hover:bg-indigo-950/5 focus:outline-none focus:ring-2 focus:ring-amber-500"><Plus size={13} /></button>
                  </span>
                </div>
              ))}
            </div>
          </div>
        )}

        <div className="grid gap-3 sm:grid-cols-2">
          <Field label="DP / uang muka">
            <input type="number" min="0" className={inputCls} value={f.dp} onChange={(e) => setF({ ...f, dp: +e.target.value })} />
          </Field>
          <Field label="Keterangan jaminan">
            <input className={inputCls} value={f.ktpCatatan} onChange={(e) => setF({ ...f, ktpCatatan: e.target.value })} placeholder="KTP a.n. Rini Astuti" />
          </Field>
          <div className="sm:col-span-2">
            <Label>Jaminan KTP</Label>
            <FotoKTP foto={f.ktpFoto} onGanti={(v) => setF({ ...f, ktpFoto: v })} setToast={setToast} />
          </div>
          <div className="sm:col-span-2">
            <Field label="Catatan">
              <input className={inputCls} value={f.catatan} onChange={(e) => setF({ ...f, catatan: e.target.value })} placeholder="Untuk pentas Hari Kartini" />
            </Field>
          </div>
        </div>

        <div className="rounded-lg bg-indigo-950 p-4 text-amber-50">
          <div className="flex justify-between text-sm text-amber-50/70">
            <span>{f.items.reduce((a, i) => a + i.qty, 0)} potong × {hari} hari</span>
            <span className="tabular-nums">{rp(subtotal)}</span>
          </div>
          <div className="mt-1 flex justify-between text-sm text-amber-50/70">
            <span>Total sewa</span><span className="tabular-nums">{rp(total)}</span>
          </div>
          {f.dp > 0 && (
            <div className="mt-1 flex justify-between text-sm text-amber-50/70">
              <span>DP dibayar</span><span className="tabular-nums">− {rp(f.dp)}</span>
            </div>
          )}
          <div className="mt-2 flex items-end justify-between border-t border-amber-50/20 pt-2">
            <span className="text-sm">Sisa saat pengambilan</span>
            <span className="font-serif text-2xl tabular-nums">{rp(sisa)}</span>
          </div>
        </div>
      </div>
    </Modal>
  );
}

/* ------------------------------------------------------------------ */
/* Pengembalian                                                        */
/* ------------------------------------------------------------------ */

function Pengembalian({ rentals, set, namaPelanggan, telat, settings, setToast, costumes }) {
  const [pilih, setPilih] = useState(null);
  const [tgl, setTgl] = useState(hariIni());
  const [denda, setDenda] = useState(0);
  const [potongan, setPotongan] = useState(0);
  const [kondisi, setKondisi] = useState("");
  const [hapusFoto, setHapusFoto] = useState(true);

  const antre = rentals
    .filter((r) => r.status === "Booking" || r.status === "Disewa")
    .sort((a, b) => (a.tglKembali > b.tglKembali ? 1 : -1));

  const bukaProses = (r) => {
    const t = hariIni();
    const lewat = Math.max(0, selisihHari(r.tglKembali, t));
    setPilih(r);
    setTgl(t);
    setDenda(lewat * settings.dendaPerHari * r.items.reduce((a, i) => a + i.qty, 0));
    setPotongan(0);
    setKondisi("");
    setHapusFoto(true);
  };

  const hitungUlang = (tglBaru) => {
    setTgl(tglBaru);
    const lewat = Math.max(0, selisihHari(pilih.tglKembali, tglBaru));
    setDenda(lewat * settings.dendaPerHari * pilih.items.reduce((a, i) => a + i.qty, 0));
  };

  const selesaikan = () => {
    const lewat = Math.max(0, selisihHari(pilih.tglKembali, tgl));
    set({
      rentals: rentals.map((r) =>
        r.id === pilih.id
          ? {
              ...r,
              status: "Selesai",
              tglDikembalikan: tgl,
              hariTelat: lewat,
              denda: +denda || 0,
              potongan: +potongan || 0,
              ktpFoto: hapusFoto ? null : r.ktpFoto,
              catatan: [r.catatan, kondisi && `Kondisi kembali: ${kondisi}`].filter(Boolean).join(" · "),
            }
          : r
      ),
    });
    setToast("Pengembalian tercatat, stok kembali tersedia");
    setPilih(null);
  };

  const sisaTagihan = pilih
    ? Math.max(0, pilih.total + (+denda || 0) + (+potongan || 0) - (pilih.dp || 0))
    : 0;

  return (
    <div className="space-y-5">
      <Header judul="Pengembalian" sub="Terima kostum, hitung sisa tagihan, kembalikan KTP" />

      {antre.length === 0 ? (
        <Kosong icon={Undo2} judul="Tidak ada kostum di luar" pesan="Semua transaksi sudah selesai. Kostum baru akan muncul di sini setelah disewa." />
      ) : (
        <div className="space-y-2.5">
          {antre.map((r) => {
            const lewat = telat(r);
            return (
              <Card key={r.id} className={`p-4 ${lewat ? "border-red-800/30 bg-red-50" : ""}`}>
                <div className="flex flex-wrap items-center justify-between gap-3">
                  <div className="min-w-0">
                    <h3 className="font-serif text-[17px] leading-tight">{namaPelanggan(r.customerId)}</h3>
                    <p className="font-mono text-[11px] text-indigo-950/50">{r.kode}</p>
                    <p className="mt-1 flex items-center gap-1.5 text-xs text-indigo-950/60">
                      <Clock size={12} /> Jatuh tempo {tglPanjang(r.tglKembali)}
                      {lewat > 0 && <Pill tone="merah">telat {lewat} hari</Pill>}
                    </p>

        )}

  );
}

const ANGKA = ["", "satu", "dua", "tiga", "empat", "lima", "enam", "tujuh", "delapan", "sembilan", "sepuluh", "sebelas"];

function eja(n) {
  n = Math.floor(Math.abs(n));
  if (n < 12) return ANGKA[n];
  if (n < 20) return eja(n - 10) + " belas";
  if (n < 100) return eja(Math.floor(n / 10)) + " puluh " + eja(n % 10);
  if (n < 200) return "seratus " + eja(n - 100);
  if (n < 1000) return eja(Math.floor(n / 100)) + " ratus " + eja(n % 100);
  if (n < 2000) return "seribu " + eja(n - 1000);
  if (n < 1000000) return eja(Math.floor(n / 1000)) + " ribu " + eja(n % 1000);
  if (n < 1000000000) return eja(Math.floor(n / 1000000)) + " juta " + eja(n % 1000000);
  return eja(Math.floor(n / 1000000000)) + " miliar " + eja(n % 1000000000);
}

const terbilang = (n) => {
  if (!n) return "Nol rupiah";
  const t = eja(n).replace(/\s+/g, " ").trim();
  return t.charAt(0).toUpperCase() + t.slice(1) + " rupiah";
};

const noHP = (hp) => {
  const d = (hp || "").replace(/\D/g, "");
  if (!d) return "";
  if (d.startsWith("62")) return d;
  if (d.startsWith("0")) return "62" + d.slice(1);
  return d;
};

const CDN_PDF = [
  "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
  "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js",
  "https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js",
];

const muatJsPDF = () =>
  new Promise((selesai, gagal) => {
    if (window.jspdf && window.jspdf.jsPDF) return selesai(window.jspdf.jsPDF);
    let i = 0;
    const coba = () => {
      if (i >= CDN_PDF.length) return gagal(new Error("Pustaka PDF tidak bisa diunduh"));
      const s = document.createElement("script");
      s.src = CDN_PDF[i++];
      s.onload = () => (window.jspdf && window.jspdf.jsPDF ? selesai(window.jspdf.jsPDF) : coba());
      s.onerror = coba;
      document.head.appendChild(s);
    };
    coba();
  });

/* Menggambar invoice langsung ke PDF supaya teksnya tajam dan ukurannya kecil */
function susunPDF(jsPDF, d) {
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const L = 18, R = 192, W = R - L;
  const nila = [30, 27, 75], emas = [176, 122, 30], merah = [127, 29, 29],
        hijau = [4, 108, 78], abu = [112, 112, 134], garis = [214, 212, 224];

  const pita = [nila, emas, merah];
  for (let i = 0; i < 21; i++) {
    const c = pita[i % 3];
    doc.setFillColor(c[0], c[1], c[2]);
    doc.rect(i * 10, 0, 10, 4, "F");
  }

  let y = 22;
  doc.setTextColor(nila[0], nila[1], nila[2]);
  doc.setFont("helvetica", "bold").setFontSize(17);
  doc.text(d.settings.namaToko, L, y);
  doc.setFont("helvetica", "normal").setFontSize(9).setTextColor(abu[0], abu[1], abu[2]);
  doc.text(d.settings.alamat || "", L, y + 5);
  doc.text(d.settings.telepon || "", L, y + 9.5);

  doc.setFont("helvetica", "bold").setFontSize(19).setTextColor(emas[0], emas[1], emas[2]);
  doc.text("INVOICE", R, y, { align: "right" });
  doc.setFont("helvetica", "normal").setFontSize(10).setTextColor(nila[0], nila[1], nila[2]);
  doc.text(d.nomor, R, y + 5.5, { align: "right" });
  doc.setFontSize(8).setTextColor(abu[0], abu[1], abu[2]);
  doc.text("Dicetak " + d.cetakPada, R, y + 10.5, { align: "right" });

  y += 18;
  doc.setDrawColor(garis[0], garis[1], garis[2]).setLineWidth(0.3);
  doc.line(L, y, R, y);

  y += 7;
  const judulKecil = (t, x, al) => {
    doc.setFont("helvetica", "bold").setFontSize(7.5).setTextColor(abu[0], abu[1], abu[2]);
    doc.text(t.toUpperCase(), x, y, al ? { align: al } : undefined);
  };
  judulKecil("Ditagihkan kepada", L);
  judulKecil("Masa sewa", R, "right");

  doc.setTextColor(nila[0], nila[1], nila[2]);
  doc.setFont("helvetica", "bold").setFontSize(11);
  doc.text(d.namaPel, L, y + 6);
  doc.setFont("helvetica", "normal").setFontSize(9).setTextColor(abu[0], abu[1], abu[2]);
  if (d.hp) doc.text(d.hp, L, y + 11);
  if (d.alamat) doc.text(doc.splitTextToSize(d.alamat, 80), L, y + 15.5);

  doc.setTextColor(nila[0], nila[1], nila[2]).setFontSize(9.5);
  doc.text(d.dari, R, y + 6, { align: "right" });
  doc.text("s/d " + d.sampai, R, y + 11, { align: "right" });
  doc.setTextColor(abu[0], abu[1], abu[2]).setFontSize(8.5);
  doc.text(d.hari + " hari  |  " + d.potong + " potong", R, y + 16, { align: "right" });

  y += 26;
  doc.setFillColor(243, 242, 248);
  doc.rect(L, y - 4.5, W, 7.5, "F");
  doc.setFont("helvetica", "bold").setFontSize(8).setTextColor(abu[0], abu[1], abu[2]);
  doc.text("KOSTUM", L + 2, y);
  doc.text("QTY", 126, y, { align: "center" });
  doc.text("TARIF/HARI", 160, y, { align: "right" });
  doc.text("JUMLAH", R - 2, y, { align: "right" });

  y += 8;
  doc.setFont("helvetica", "normal").setFontSize(9.5).setTextColor(nila[0], nila[1], nila[2]);
  d.items.forEach((i) => {
    if (y > 245) { doc.addPage(); y = 25; }
    const baris = doc.splitTextToSize(i.nama, 82);
    doc.text(baris, L + 2, y);
    doc.text(String(i.qty), 126, y, { align: "center" });
    doc.text(i.tarif, 160, y, { align: "right" });
    doc.text(i.jumlah, R - 2, y, { align: "right" });
    y += 5 * baris.length + 2.5;
    doc.setDrawColor(238, 237, 244);
    doc.line(L, y - 3.5, R, y - 3.5);
  });

  y += 3;
  const x1 = 128, x2 = R;
  const ringkas = (k, v, tebal) => {
    doc.setFont("helvetica", tebal ? "bold" : "normal").setFontSize(tebal ? 11 : 9.5);
    doc.setTextColor(tebal ? nila[0] : abu[0], tebal ? nila[1] : abu[1], tebal ? nila[2] : abu[2]);
    doc.text(k, x1, y);
    doc.setTextColor(nila[0], nila[1], nila[2]);
    doc.text(v, x2, y, { align: "right" });
    y += tebal ? 7 : 5.5;
  };
  d.ringkasan.forEach((b) => ringkas(b[0], b[1]));
  doc.setDrawColor(garis[0], garis[1], garis[2]);
  doc.line(x1, y - 2, R, y - 2);
  y += 3;
  ringkas("Total tagihan", d.total, true);
  d.setelah.forEach((b) => ringkas(b[0], b[1]));
  ringkas("Jaminan", d.jaminan);

  y += 4;
  doc.setFillColor(254, 249, 235);
  doc.rect(L, y - 5, W, 12, "F");
  doc.setFont("helvetica", "italic").setFontSize(8.5).setTextColor(abu[0], abu[1], abu[2]);
  doc.text(doc.splitTextToSize("Terbilang: " + d.terbilang, 118), L + 3, y);
  const cap = d.lunas ? hijau : merah;
  doc.setDrawColor(cap[0], cap[1], cap[2]).setLineWidth(0.6);
  doc.rect(R - 36, y - 3.5, 33, 9);
  doc.setFont("helvetica", "bold").setFontSize(10).setTextColor(cap[0], cap[1], cap[2]);
  doc.text(d.lunas ? "LUNAS" : "BELUM LUNAS", R - 19.5, y + 2.2, { align: "center" });

  y += 16;
  if (d.catatan) {
    doc.setFont("helvetica", "normal").setFontSize(8.5).setTextColor(abu[0], abu[1], abu[2]);
    doc.text(doc.splitTextToSize("Catatan: " + d.catatan, W), L, y);
    y += 6;
  }
  doc.setFont("helvetica", "normal").setFontSize(7.5).setTextColor(abu[0], abu[1], abu[2]);
  doc.text(doc.splitTextToSize(d.syarat, W), L, y);

  y = Math.min(Math.max(y + 18, 232), 250);
  doc.setDrawColor(180, 178, 196).setLineWidth(0.3);
  doc.line(L + 6, y, L + 56, y);
  doc.line(R - 56, y, R - 6, y);
  doc.setFontSize(8.5).setTextColor(nila[0], nila[1], nila[2]);
  doc.text(d.namaPel, L + 31, y + 5, { align: "center" });
  doc.text(d.settings.namaToko, R - 31, y + 5, { align: "center" });
  doc.setFontSize(7.5).setTextColor(abu[0], abu[1], abu[2]);
  doc.text("Penyewa", L + 31, y - 12, { align: "center" });
  doc.text("Hormat kami", R - 31, y - 12, { align: "center" });

  return doc;
}

function Invoice({ rentals, customers, settings, set, namaPelanggan, setToast }) {
  const urut = [...rentals].sort((a, b) => (a.tglSewa < b.tglSewa ? 1 : -1));
  const [id, setId] = useState(urut[0]?.id || "");
  const [jam, setJam] = useState(new Date());
  const [sibuk, setSibuk] = useState(false);

  useEffect(() => {
    const t = setInterval(() => setJam(new Date()), 30000);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    if (!urut.find((r) => r.id === id)) setId(urut[0]?.id || "");
    // eslint-disable-next-line
  }, [rentals.length]);

  const r = urut.find((x) => x.id === id);

  const cetakPada = jam.toLocaleString("id-ID", {
    weekday: "long", day: "numeric", month: "long", year: "numeric",
    hour: "2-digit", minute: "2-digit", timeZoneName: "short",
  });

  if (urut.length === 0)
    return (
      <div className="space-y-5">
        <Header judul="Invoice" sub="Tagihan resmi untuk dikirim ke penyewa" />
        <Kosong icon={FileText} judul="Belum ada yang bisa ditagih" pesan="Buat transaksi sewa lebih dulu, invoicenya akan muncul di sini." />
      </div>
    );

  const hari = durasi(r.tglSewa, r.tglKembali);
  const total = r.total + (r.denda || 0) + (r.potongan || 0);
  const sisa = sisaBayar(r);
  const pel = customers.find((c) => c.id === r.customerId);
  const nomor = "INV/" + r.kode.replace("SW-", "");
  const lunas = !!r.lunas;

  const pesanWA = [
    "*" + settings.namaToko + "*",
    "Invoice " + nomor,
    cetakPada,
    "",
    "Penyewa: " + namaPelanggan(r.customerId),
    "Sewa: " + tglPanjang(r.tglSewa) + " s/d " + tglPanjang(r.tglKembali) + " (" + hari + " hari)",
    "",
    ...r.items.map((i) => "- " + i.nama + " x" + i.qty + " = " + rp(i.harga * i.qty * hari)),
    "",
    "Subtotal: " + rp(r.subtotal),
    r.denda > 0 ? "Denda keterlambatan: " + rp(r.denda) : null,
    r.potongan > 0 ? "Potongan kerusakan: " + rp(r.potongan) : null,
    "Total tagihan: " + rp(total),
    r.dp > 0 ? "DP dibayar: -" + rp(r.dp) : null,
    "*SISA DIBAYAR: " + rp(sisa) + "*",
    "Jaminan: " + (r.ktpFoto ? "KTP diterima" : r.ktpCatatan || "-"),
    "Status: " + (lunas ? "LUNAS" : "BELUM LUNAS"),
    "",
    "Terima kasih sudah mempercayakan busana acara Anda kepada kami.",
    settings.namaToko + " - " + settings.telepon,
  ].filter((x) => x !== null).join("\n");

  const tautanWA = "https://wa.me/" + noHP(pel?.hp) + "?text=" + encodeURIComponent(pesanWA);

  const kirimPDF = async () => {
    setSibuk(true);
    try {
      const jsPDF = await muatJsPDF();
      const doc = susunPDF(jsPDF, {
        settings,
        nomor,
        cetakPada,
        namaPel: namaPelanggan(r.customerId),
        hp: pel?.hp || "",
        alamat: pel?.alamat || "",
        dari: tglPanjang(r.tglSewa),
        sampai: tglPanjang(r.tglKembali),
        hari,
        potong: r.items.reduce((a, i) => a + i.qty, 0),
        items: r.items.map((i) => ({ nama: i.nama, qty: i.qty, tarif: rp(i.harga), jumlah: rp(i.harga * i.qty * hari) })),
        ringkasan: [
          ["Subtotal " + hari + " hari", rp(r.subtotal)],
          ...(r.denda > 0 ? [["Denda " + r.hariTelat + " hari", rp(r.denda)]] : []),
          ...(r.potongan > 0 ? [["Potongan kerusakan", rp(r.potongan)]] : []),
        ],
        total: rp(total),
        setelah: [
          ...(r.dp > 0 ? [["DP dibayar", "- " + rp(r.dp)]] : []),
          ["Sisa dibayar", rp(sisa)],
        ],
        jaminan: r.ktpFoto ? "KTP diterima" : r.ktpCatatan || "-",
        terbilang: terbilang(sisa),
        lunas,
        catatan: r.catatan || "",
        syarat:
          "Kostum dikembalikan sesuai tanggal di atas. Keterlambatan dikenakan denda " +
          rp(settings.dendaPerHari) +
          " per potong per hari. Kerusakan atau kehilangan diganti sesuai nilai kostum. KTP jaminan dikembalikan setelah kostum diterima kembali dengan baik.",
      });

      const namaBerkas = "Invoice " + nomor.replace(/\//g, "-") + " " + namaPelanggan(r.customerId) + ".pdf";
      const blob = doc.output("blob");
      const berkas = new File([blob], namaBerkas, { type: "application/pdf" });

      if (navigator.canShare && navigator.canShare({ files: [berkas] })) {
        await navigator.share({
          files: [berkas],
          title: "Invoice " + nomor,
          text: "Invoice sewa kostum dari " + settings.namaToko,
        });
      } else {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = namaBerkas;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        setToast("PDF tersimpan, lampirkan lewat WhatsApp");
      }
    } catch (e) {
      if (e && e.name === "AbortError") return;
      setToast("PDF gagal dibuat: " + (e.message || "coba lagi"));
    } finally {
      setSibuk(false);
    }
  };

  const toggleLunas = () => {
    set({ rentals: rentals.map((x) => (x.id === r.id ? { ...x, lunas: !x.lunas } : x)) });
    setToast(lunas ? "Ditandai belum lunas" : "Ditandai lunas");
  };

  return (
    <div className="space-y-5">
      <style>{`
        @media print {
          @page { margin: 12mm; }
          body { background: #fff !important; }
          body * { visibility: hidden !important; }
          #lembar-invoice, #lembar-invoice * { visibility: visible !important; }
          #lembar-invoice { position: absolute; left: 0; top: 0; width: 100%;
            border: 0 !important; box-shadow: none !important; }
          .tanpa-cetak { display: none !important; }
        }
      `}</style>

      <div className="tanpa-cetak">
        <Header judul="Invoice" sub="Tagihan resmi untuk dikirim ke penyewa" />
      </div>

      <div className="tanpa-cetak flex flex-wrap gap-2">
        <select className={inputCls + " min-w-[200px] flex-1"} value={id} onChange={(e) => setId(e.target.value)}>
          {urut.map((x) => (
            <option key={x.id} value={x.id}>
              {x.kode} · {namaPelanggan(x.customerId)} · {rp(x.total + (x.denda || 0))}
            </option>
          ))}
        </select>
        <Btn variant="outline" onClick={toggleLunas}>
          <Check size={15} /> {lunas ? "Batalkan lunas" : "Tandai lunas"}
        </Btn>
        <Btn variant="gold" onClick={kirimPDF} disabled={sibuk}>
          <FileText size={15} /> {sibuk ? "Menyiapkan PDF…" : "Kirim sebagai PDF"}
        </Btn>
        <a
          href={tautanWA}
          target="_blank"
          rel="noopener noreferrer"
          className="inline-flex items-center justify-center gap-2 rounded-lg border border-indigo-950/20 bg-white px-3.5 py-2 text-sm font-semibold text-indigo-950 hover:bg-indigo-950/5 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:ring-offset-2"
        >
          <MessageCircle size={15} /> Kirim rincian teks
        </a>
        <Btn variant="ghost" onClick={() => window.print()}>
          <Printer size={15} /> Cetak
        </Btn>
      </div>

      <p className="tanpa-cetak text-xs text-indigo-950/50">
        <b>Kirim sebagai PDF</b> membuat berkas invoice lalu membuka pilihan aplikasi — pilih WhatsApp dan kontaknya. Kalau HP tidak mendukung berbagi berkas, PDF akan terunduh dan bisa dilampirkan manual.
      </p>

      {/* Lembar yang dicetak */}
      <div id="lembar-invoice" className="overflow-hidden rounded-xl border border-indigo-950/10 bg-white">
        <div className="h-2.5 w-full" style={kain()} />
        <div className="p-5 sm:p-7">
          <div className="flex flex-wrap items-start justify-between gap-4">
            <div>
              <p className="font-serif text-xl leading-tight">{settings.namaToko}</p>
              <p className="mt-1 text-xs text-indigo-950/55">{settings.alamat}</p>
              <p className="text-xs text-indigo-950/55">{settings.telepon}</p>
            </div>
            <div className="text-right">
              <p className="font-serif text-2xl tracking-wide text-amber-700">INVOICE</p>
              <p className="mt-1 font-mono text-xs">{nomor}</p>
              <p className="mt-2 text-[11px] leading-snug text-indigo-950/55">
                Dicetak<br />{cetakPada}
              </p>
            </div>
          </div>

          <div className="mt-6 grid gap-4 border-y border-indigo-950/10 py-4 sm:grid-cols-2">
            <div>
              <Label>Ditagihkan kepada</Label>

function Pelanggan({ customers, rentals, set, setToast }) {
  const [form, setForm] = useState(null);
  const [q, setQ] = useState("");

  const hasil = customers.filter((c) => (c.nama + c.hp).toLowerCase().includes(q.toLowerCase()));

  const riwayat = (id) => rentals.filter((r) => r.customerId === id);

  const simpan = () => {
    if (!form.nama.trim()) return setToast("Nama pelanggan belum diisi");
    if (form.id) set({ customers: customers.map((c) => (c.id === form.id ? form : c)) });
    else set({ customers: [...customers, { ...form, id: uid() }] });
    setToast("Data pelanggan tersimpan");
    setForm(null);
  };

  return (
    <div className="space-y-5">
      <Header
        judul="Pelanggan"
        sub={`${customers.length} penyewa terdaftar`}
        aksi={<Btn onClick={() => setForm({ nama: "", hp: "", alamat: "", jaminan: "KTP", catatan: "" })}><Plus size={16} /> Tambah pelanggan</Btn>}
      />

      <div className="relative">
        <Search size={15} className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-indigo-950/35" />
        <input className={inputCls + " pl-9"} placeholder="Cari nama atau nomor HP" value={q} onChange={(e) => setQ(e.target.value)} />
      </div>

      {hasil.length === 0 ? (
        <Kosong icon={Users} judul="Belum ada pelanggan" pesan="Tambahkan data penyewa agar transaksi berikutnya lebih cepat." />
      ) : (
        <div className="grid gap-3 sm:grid-cols-2">
          {hasil.map((c) => {
            const r = riwayat(c.id);
            const belanja = r.filter((x) => x.status === "Selesai").reduce((a, x) => a + x.total + (x.denda || 0), 0);
            return (
              <Card key={c.id} className="p-4">
                <div className="flex items-start justify-between gap-2">
                  <div className="min-w-0">
                    <h3 className="font-serif text-[17px] leading-tight">{c.nama}</h3>
                    <p className="mt-1 flex items-center gap-1.5 text-xs text-indigo-950/55"><Phone size={12} /> {c.hp || "—"}</p>
                    {c.alamat && <p className="mt-0.5 text-xs text-indigo-950/45">{c.alamat}</p>}
                  </div>
                  <button onClick={() => setForm(c)} aria-label={`Ubah ${c.nama}`} className="rounded-lg p-1.5 text-indigo-950/40 hover:bg-indigo-950/5 focus:outline-none focus:ring-2 focus:ring-amber-500">
                    <Pencil size={15} />
                  </button>
                </div>
                <div className="mt-3 flex items-center gap-4 border-t border-indigo-950/10 pt-3 text-xs">
                  <span><span className="font-serif text-base tabular-nums">{r.length}</span> transaksi</span>
                  <span><span className="font-serif text-base tabular-nums">{rp(belanja)}</span> total</span>
                  <Pill>{c.jaminan || "KTP"}</Pill>
                </div>
                {c.catatan && <p className="mt-2 text-xs italic text-indigo-950/45">{c.catatan}</p>}
              </Card>
            );
          })}
        </div>
      )}

      <Modal
        open={!!form}
        onClose={() => setForm(null)}
        title={form?.id ? "Ubah pelanggan" : "Tambah pelanggan"}
        footer={
          <>
            {form?.id && (
              <Btn variant="danger" onClick={() => { set({ customers: customers.filter((c) => c.id !== form.id) }); setForm(null); setToast("Pelanggan dihapus"); }}>
                <Trash2 size={15} /> Hapus
              </Btn>
            )}
            <Btn variant="ghost" onClick={() => setForm(null)}>Batal</Btn>
            <Btn variant="gold" onClick={simpan}>Simpan pelanggan</Btn>
          </>
        }
      >
        {form && (
          <div className="grid gap-3 sm:grid-cols-2">
            <Field label="Nama"><input className={inputCls} value={form.nama} onChange={(e) => setForm({ ...form, nama: e.target.value })} /></Field>
            <Field label="Nomor HP"><input className={inputCls} value={form.hp} onChange={(e) => setForm({ ...form, hp: e.target.value })} /></Field>
            <div className="sm:col-span-2">
              <Field label="Alamat"><input className={inputCls} value={form.alamat} onChange={(e) => setForm({ ...form, alamat: e.target.value })} /></Field>
            </div>
            <Field label="Jaminan dititipkan">
              <select className={inputCls} value={form.jaminan} onChange={(e) => setForm({ ...form, jaminan: e.target.value })}>
                <option>KTP</option><option>SIM</option><option>Kartu pelajar</option><option>Surat sekolah</option><option>Uang tunai</option>
              </select>
            </Field>
            <Field label="Catatan"><input className={inputCls} value={form.catatan} onChange={(e) => setForm({ ...form, catatan: e.target.value })} /></Field>
          </div>
        )}

    </div>
  );

function Jadwal({ rentals, namaPelanggan, statusTampil, tonePill }) {
  const t = hariIni();
  const batas = tambahHari(t, 30);

  const agenda = [];
  rentals
    .filter((r) => r.status === "Booking" || r.status === "Disewa")
    .forEach((r) => {
      if (r.tglSewa >= t && r.tglSewa <= batas) agenda.push({ tgl: r.tglSewa, jenis: "Ambil", r });
      if (r.tglKembali >= t && r.tglKembali <= batas) agenda.push({ tgl: r.tglKembali, jenis: "Kembali", r });
    });
  agenda.sort((a, b) => (a.tgl > b.tgl ? 1 : a.tgl < b.tgl ? -1 : a.jenis > b.jenis ? 1 : -1));

  const perTanggal = agenda.reduce((m, a) => {
    (m[a.tgl] = m[a.tgl] || []).push(a);
    return m;
  }, {});

  return (
    <div className="space-y-5">
      <Header judul="Jadwal" sub="Pengambilan dan pengembalian 30 hari ke depan" />
      {Object.keys(perTanggal).length === 0 ? (
        <Kosong icon={CalendarDays} judul="Agenda masih kosong" pesan="Booking yang dibuat akan muncul di sini sesuai tanggalnya." />
      ) : (
        <div className="space-y-4">
          {Object.entries(perTanggal).map(([tgl, list]) => (
            <div key={tgl} className="flex gap-3 sm:gap-4">
              <div className="w-14 shrink-0 text-right">
                <p className="font-serif text-2xl leading-none tabular-nums">{tgl.slice(8)}</p>
                <p className="text-[11px] uppercase tracking-wider text-indigo-950/45">
                  {new Date(tgl + "T00:00:00").toLocaleDateString("id-ID", { month: "short" })}
                </p>
                {tgl === t && <span className="mt-1 inline-block rounded-full bg-amber-500 px-1.5 py-0.5 text-[10px] font-bold text-indigo-950">Hari ini</span>}
              </div>
              <div className="min-w-0 flex-1 space-y-2 border-l border-indigo-950/10 pl-3 sm:pl-4">
                {list.map((a, n) => (
                  <Card key={n} className="flex items-center justify-between gap-3 p-3">
                    <div className="min-w-0">
                      <p className="truncate text-sm font-medium">{namaPelanggan(a.r.customerId)}</p>
                      <p className="truncate text-[11px] text-indigo-950/50">{a.r.items.map((i) => i.nama).join(", ")}</p>
                    </div>
                    <Pill tone={a.jenis === "Ambil" ? "emas" : "nila"}>{a.jenis}</Pill>
                  </Card>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}
