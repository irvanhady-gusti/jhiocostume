function susunLaporanPDF(jsPDF, d) {
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const L = 15, R = 195;
  const nila = [30, 27, 75], emas = [176, 122, 30], merah = [127, 29, 29],
        abu = [112, 112, 134], garis = [216, 214, 226];
  const pita = [nila, emas, merah];

  const pitaAtas = () => {
    for (let i = 0; i < 21; i++) {
      const c = pita[i % 3];
      doc.setFillColor(c[0], c[1], c[2]);
      doc.rect(i * 10, 0, 10, 4, "F");
    }
  };

  const kepalaTabel = (y) => {
    doc.setFillColor(243, 242, 248);
    doc.rect(L, y - 4.5, R - L, 7.5, "F");
    doc.setFont("helvetica", "bold").setFontSize(7.5).setTextColor(abu[0], abu[1], abu[2]);
    doc.text("TANGGAL", L + 2, y);
    doc.text("KODE", 40, y);
    doc.text("PENYEWA", 70, y);
    doc.text("PTG", 128, y, { align: "center" });
    doc.text("NILAI", 163, y, { align: "right" });
    doc.text("STATUS", R - 2, y, { align: "right" });
    return y + 7;
  };

  pitaAtas();
  let y = 21;
  doc.setFont("helvetica", "bold").setFontSize(16).setTextColor(nila[0], nila[1], nila[2]);
  doc.text(d.settings.namaToko, L, y);
  doc.setFont("helvetica", "normal").setFontSize(9).setTextColor(abu[0], abu[1], abu[2]);
  doc.text(d.settings.alamat + "  |  " + d.settings.telepon, L, y + 5);

  doc.setFont("helvetica", "bold").setFontSize(13).setTextColor(emas[0], emas[1], emas[2]);
  doc.text("LAPORAN PENYEWAAN", R, y, { align: "right" });
  doc.setFont("helvetica", "normal").setFontSize(9).setTextColor(nila[0], nila[1], nila[2]);
  doc.text(d.periode, R, y + 5.5, { align: "right" });
  doc.setFontSize(7.5).setTextColor(abu[0], abu[1], abu[2]);
  doc.text("Dicetak " + d.cetakPada, R, y + 10, { align: "right" });

  y += 17;
  doc.setDrawColor(garis[0], garis[1], garis[2]).setLineWidth(0.3);
  doc.line(L, y, R, y);

  // Ringkasan dalam empat kotak
  y += 6;
  const lebar = (R - L - 9) / 4;
  d.ringkasan.forEach((k, i) => {
    const x = L + i * (lebar + 3);
    doc.setFillColor(249, 248, 252);
    doc.rect(x, y, lebar, 17, "F");
    doc.setFont("helvetica", "bold").setFontSize(11).setTextColor(nila[0], nila[1], nila[2]);
    doc.text(k[1], x + 3, y + 8);
    doc.setFont("helvetica", "normal").setFontSize(7).setTextColor(abu[0], abu[1], abu[2]);
    doc.text(k[0], x + 3, y + 13);
  });

  y += 27;
  doc.setFont("helvetica", "bold").setFontSize(10).setTextColor(nila[0], nila[1], nila[2]);
  doc.text("Rincian transaksi", L, y);
  y += 7;
  y = kepalaTabel(y);

  doc.setFont("helvetica", "normal").setFontSize(8.5);
  if (d.baris.length === 0) {
    doc.setTextColor(abu[0], abu[1], abu[2]);
    doc.text("Tidak ada transaksi pada periode ini.", L + 2, y);
    y += 8;
  }
  d.baris.forEach((b) => {
    if (y > 262) { doc.addPage(); pitaAtas(); y = kepalaTabel(21); doc.setFont("helvetica", "normal").setFontSize(8.5); }
    doc.setTextColor(nila[0], nila[1], nila[2]);
    doc.text(b.tgl, L + 2, y);
    doc.text(b.kode, 40, y);
    doc.text(doc.splitTextToSize(b.nama, 54)[0], 70, y);
    doc.text(String(b.potong), 128, y, { align: "center" });
    doc.text(b.nilai, 163, y, { align: "right" });
    doc.setTextColor(abu[0], abu[1], abu[2]);
    doc.text(b.status, R - 2, y, { align: "right" });
    y += 5.5;
    doc.setDrawColor(238, 237, 244);
    doc.line(L, y - 3.6, R, y - 3.6);
  });

  // Dua daftar peringkat berdampingan
  if (y > 215) { doc.addPage(); pitaAtas(); y = 21; }
  y += 8;
  const kolom = [
    { judul: "Kostum paling sering disewa", isi: d.populer, x: L },
    { judul: "Pelanggan teratas", isi: d.teratas, x: 108 },
  ];
  kolom.forEach((k) => {
    let ky = y;
    doc.setFont("helvetica", "bold").setFontSize(9.5).setTextColor(nila[0], nila[1], nila[2]);
    doc.text(k.judul, k.x, ky);
    ky += 6;
    doc.setFont("helvetica", "normal").setFontSize(8.5);
    if (k.isi.length === 0) {
      doc.setTextColor(abu[0], abu[1], abu[2]);
      doc.text("Belum ada data.", k.x, ky);
    }
    k.isi.forEach((it, n) => {
      doc.setTextColor(abu[0], abu[1], abu[2]);
      doc.text(String(n + 1) + ".", k.x, ky);
      doc.setTextColor(nila[0], nila[1], nila[2]);
      doc.text(doc.splitTextToSize(it[0], 52)[0], k.x + 5, ky);
      doc.text(it[1], k.x + 72, ky, { align: "right" });
      ky += 5.2;
    });
  });

  const halaman = doc.internal.getNumberOfPages();
  for (let i = 1; i <= halaman; i++) {
    doc.setPage(i);
    doc.setFont("helvetica", "normal").setFontSize(7).setTextColor(abu[0], abu[1], abu[2]);
    doc.text(d.settings.namaToko + " · " + d.periode, L, 289);
    doc.text("Halaman " + i + " dari " + halaman, R, 289, { align: "right" });
  }
  return doc;
}

const PERIODE = [
  { id: "bulan", label: "Bulan ini" },
  { id: "tiga", label: "3 bulan terakhir" },
  { id: "tahun", label: "Tahun ini" },
  { id: "semua", label: "Semua waktu" },
];

function Laporan({ rentals, costumes, customers, settings, namaPelanggan, statusTampil, setToast }) {
  const [periode, setPeriode] = useState("bulan");
  const [sibuk, setSibuk] = useState(false);
  const [jam, setJam] = useState(new Date());

  useEffect(() => {
    const t = setInterval(() => setJam(new Date()), 30000);
    return () => clearInterval(t);
  }, []);

  const mulai = useMemo(() => {
    const d = new Date();
    if (periode === "bulan") return hariIni().slice(0, 8) + "01";
    if (periode === "tiga") { d.setDate(1); d.setMonth(d.getMonth() - 2); }
    else if (periode === "tahun") { d.setMonth(0); d.setDate(1); }
    else return "0000-00-00";
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }, [periode]);

  const labelPeriode =
    periode === "semua"
      ? "Semua waktu"
      : tglPanjang(mulai).replace(/^\w+, /, "") + " – " + tglPanjang(hariIni()).replace(/^\w+, /, "");

  const cetakPada = jam.toLocaleString("id-ID", {
    day: "numeric", month: "long", year: "numeric",
    hour: "2-digit", minute: "2-digit", timeZoneName: "short",
  });

  const dalam = (r) => (r.tglDikembalikan || r.tglSewa) >= mulai;
  const daftar = rentals.filter(dalam).sort((a, b) => (a.tglSewa < b.tglSewa ? 1 : -1));
  const selesai = daftar.filter((r) => r.status === "Selesai");

  const pendapatan = selesai.reduce((a, r) => a + r.total + (r.denda || 0), 0);
  const dendaTotal = selesai.reduce((a, r) => a + (r.denda || 0), 0);
  const belumLunas = daftar.reduce((a, r) => a + sisaBayar(r), 0);
  const potongKeluar = daftar.reduce((a, r) => a + r.items.reduce((x, i) => x + i.qty, 0), 0);

  const ringkasan = [
    ["Pemasukan", rp(pendapatan)],
    ["Transaksi", String(daftar.length)],
    ["Potong disewa", String(potongKeluar)],
    ["Belum dibayar", rp(belumLunas)],
  ];

  const bulanan = useMemo(() => {
    const out = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date();
      d.setDate(1);
      d.setMonth(d.getMonth() - i);
      const kunci = d.toISOString().slice(0, 7);
      const nilai = rentals
        .filter((r) => r.status === "Selesai" && (r.tglDikembalikan || r.tglSewa).slice(0, 7) === kunci)
        .reduce((a, r) => a + r.total + (r.denda || 0), 0);
      out.push({ label: d.toLocaleDateString("id-ID", { month: "short" }), nilai });
    }
    return out;
  }, [rentals]);

  const maks = Math.max(1, ...bulanan.map((b) => b.nilai));

  const populer = useMemo(() => {
    const m = {};
    daftar.forEach((r) => r.items.forEach((i) => (m[i.nama] = (m[i.nama] || 0) + i.qty)));
    return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 5);
  }, [rentals, periode]);

  const teratas = useMemo(() => {
    const m = {};
    selesai.forEach((r) => (m[r.customerId] = (m[r.customerId] || 0) + r.total + (r.denda || 0)));
    return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 5);
  }, [rentals, periode]);

  const unduhPDF = async () => {
    setSibuk(true);
    try {
      const jsPDF = await muatJsPDF();
      const doc = susunLaporanPDF(jsPDF, {
        settings,
        periode: labelPeriode,
        cetakPada,
        ringkasan,
        baris: daftar.map((r) => ({
          tgl: tglPendek(r.tglSewa),
          kode: r.kode,
          nama: namaPelanggan(r.customerId),
          potong: r.items.reduce((a, i) => a + i.qty, 0),
          nilai: rp(r.total + (r.denda || 0)),
          status: statusTampil(r),
        })),
        populer: populer.map((x) => [x[0], x[1] + "x"]),
        teratas: teratas.map((x) => [namaPelanggan(x[0]), rp(x[1])]),
      });

      const namaBerkas = "Laporan " + settings.namaToko + " " + labelPeriode + ".pdf";
      const blob = doc.output("blob");
      const berkas = new File([blob], namaBerkas, { type: "application/pdf" });

      if (navigator.canShare && navigator.canShare({ files: [berkas] })) {
        await navigator.share({ files: [berkas], title: "Laporan " + labelPeriode });
      } else {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = namaBerkas;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        setToast("Laporan PDF terunduh");
      }
    } catch (e) {
      if (e && e.name === "AbortError") return;
      setToast("Laporan gagal dibuat: " + (e.message || "coba lagi"));
    } finally {
      setSibuk(false);
    }
  };

  return (
    <div className="space-y-5">
      <style>{`
        @media print {
          @page { margin: 12mm; }
          body { background: #fff !important; }
          body * { visibility: hidden !important; }
          #lembar-laporan, #lembar-laporan * { visibility: visible !important; }
          #lembar-laporan { position: absolute; left: 0; top: 0; width: 100%;
            border: 0 !important; box-shadow: none !important; }
          .tanpa-cetak { display: none !important; }
        }
      `}</style>

      <div className="tanpa-cetak">
        <Header judul="Laporan" sub="Pilih periode, tinjau, lalu unduh atau kirim" />
      </div>

      <div className="tanpa-cetak flex flex-wrap gap-2">
        <select className={inputCls + " min-w-[160px] flex-1"} value={periode} onChange={(e) => setPeriode(e.target.value)}>
          {PERIODE.map((o) => <option key={o.id} value={o.id}>{o.label}</option>)}
        </select>
        <Btn variant="gold" onClick={unduhPDF} disabled={sibuk}>
          <Download size={15} /> {sibuk ? "Menyiapkan…" : "Unduh PDF"}
        </Btn>
        <Btn variant="ghost" onClick={() => window.print()}>
          <Printer size={15} /> Cetak
        </Btn>
      </div>

      <Card className="tanpa-cetak p-4">
        <h3 className="font-serif text-base">Pemasukan 6 bulan terakhir</h3>
        <div className="mt-4 flex h-40 items-end gap-2">
          {bulanan.map((b, i) => (
            <div key={i} className="flex flex-1 flex-col items-center gap-1.5">
              <span className="text-[10px] tabular-nums text-indigo-950/45">{b.nilai > 0 ? Math.round(b.nilai / 1000) + "rb" : ""}</span>
              <div
                className="w-full rounded-t"
                style={{ height: `${Math.max(3, (b.nilai / maks) * 100)}%`, ...(b.nilai > 0 ? kain() : { background: "rgba(30,27,75,0.07)" }) }}
              />
              <span className="text-[11px] text-indigo-950/50">{b.label}</span>
            </div>
          ))}
        </div>
      </Card>

      {/* Lembar yang diunduh dan dicetak */}
      <div id="lembar-laporan" className="overflow-hidden rounded-xl border border-indigo-950/10 bg-white">
        <div className="h-2.5 w-full" style={kain()} />
        <div className="p-5 sm:p-7">
          <div className="flex flex-wrap items-start justify-between gap-4">
            <div>
              <p className="font-serif text-xl leading-tight">{settings.namaToko}</p>
              <p className="mt-1 text-xs text-indigo-950/55">{settings.alamat} · {settings.telepon}</p>
            </div>
            <div className="text-right">
              <p className="font-serif text-lg tracking-wide text-amber-700">LAPORAN PENYEWAAN</p>
              <p className="mt-0.5 text-xs">{labelPeriode}</p>
              <p className="mt-1 text-[11px] text-indigo-950/50">Dicetak {cetakPada}</p>
            </div>
          </div>

          <div className="mt-5 grid grid-cols-2 gap-2.5 border-y border-indigo-950/10 py-4 sm:grid-cols-4">
            {ringkasan.map((k) => (
              <div key={k[0]} className="rounded-lg bg-indigo-950/[0.03] px-3 py-2.5">
                <p className="font-serif text-lg leading-tight tabular-nums">{k[1]}</p>
                <p className="mt-0.5 text-[11px] text-indigo-950/50">{k[0]}</p>
              </div>
            ))}
          </div>

          <h3 className="mt-5 font-serif text-base">Rincian transaksi</h3>
          <div className="mt-2 overflow-x-auto">
            <table className="w-full min-w-[520px] text-left text-xs">
              <thead>
                <tr className="border-b border-indigo-950/15 text-[10px] uppercase tracking-wider text-indigo-950/50">
                  <th className="py-2">Tanggal</th>
                  <th className="py-2">Kode</th>
                  <th className="py-2">Penyewa</th>
                  <th className="py-2 text-center">Ptg</th>
                  <th className="py-2 text-right">Nilai</th>
                  <th className="py-2 text-right">Status</th>
                </tr>
              </thead>
              <tbody>
                {daftar.length === 0 && (
                  <tr><td colSpan="6" className="py-4 text-center text-indigo-950/45">Tidak ada transaksi pada periode ini.</td></tr>
                )}
                {daftar.map((r) => (
                  <tr key={r.id} className="border-b border-indigo-950/5">
                    <td className="py-2 whitespace-nowrap">{tglPendek(r.tglSewa)}</td>
                    <td className="py-2 font-mono text-[11px]">{r.kode}</td>
                    <td className="py-2">{namaPelanggan(r.customerId)}</td>
                    <td className="py-2 text-center tabular-nums">{r.items.reduce((a, i) => a + i.qty, 0)}</td>
                    <td className="py-2 text-right tabular-nums">{rp(r.total + (r.denda || 0))}</td>
                    <td className="py-2 text-right text-indigo-950/55">{statusTampil(r)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <div className="mt-6 grid gap-5 sm:grid-cols-2">
            <div>
              <h3 className="font-serif text-base">Kostum paling sering disewa</h3>
              <div className="mt-2 space-y-1.5">
                {populer.length === 0 && <p className="text-xs text-indigo-950/45">Belum ada data.</p>}
                {populer.map(([nama, n], i) => (
                  <div key={nama} className="flex items-center gap-3 text-sm">
                    <span className="w-4 font-serif text-indigo-950/35 tabular-nums">{i + 1}</span>
                    <span className="min-w-0 flex-1 truncate">{nama}</span>
                    <span className="tabular-nums text-indigo-950/55">{n}×</span>
                  </div>
                ))}
              </div>
            </div>
            <div>
              <h3 className="font-serif text-base">Pelanggan teratas</h3>
              <div className="mt-2 space-y-1.5">
                {teratas.length === 0 && <p className="text-xs text-indigo-950/45">Belum ada transaksi selesai.</p>}
                {teratas.map(([id, nilai], i) => (
                  <div key={id} className="flex items-center gap-3 text-sm">
                    <span className="w-4 font-serif text-indigo-950/35 tabular-nums">{i + 1}</span>
                    <span className="min-w-0 flex-1 truncate">{namaPelanggan(id)}</span>
                    <span className="tabular-nums text-indigo-950/55">{rp(nilai)}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <p className="mt-6 border-t border-indigo-950/10 pt-3 text-[11px] text-indigo-950/50">
            Pemasukan dihitung dari transaksi berstatus selesai, termasuk denda keterlambatan.
            Kolom belum dibayar mencakup sisa tagihan seluruh transaksi pada periode ini.
          </p>
        </div>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Pengaturan                                                          */
/* ------------------------------------------------------------------ */

function Pengaturan({ settings, set, data, setToast }) {
  const [f, setF] = useState(settings);
  const [konfirmasi, setKonfirmasi] = useState(false);

  const unduh = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `cadangan-rental-${hariIni()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    setToast("Cadangan diunduh");
  };

  return (
    <div className="space-y-5">
      <Header judul="Pengaturan" sub="Identitas usaha dan aturan denda" />

      <Card className="p-4">
        <div className="grid gap-3 sm:grid-cols-2">
          <div className="sm:col-span-2">
            <Field label="Nama usaha"><input className={inputCls} value={f.namaToko} onChange={(e) => setF({ ...f, namaToko: e.target.value })} /></Field>
          </div>
          <Field label="Telepon"><input className={inputCls} value={f.telepon} onChange={(e) => setF({ ...f, telepon: e.target.value })} /></Field>
          <Field label="Denda per potong per hari">
            <input type="number" min="0" className={inputCls} value={f.dendaPerHari} onChange={(e) => setF({ ...f, dendaPerHari: +e.target.value })} />
          </Field>
          <div className="sm:col-span-2">
            <Field label="Alamat"><input className={inputCls} value={f.alamat} onChange={(e) => setF({ ...f, alamat: e.target.value })} /></Field>
          </div>
        </div>
        <div className="mt-4 flex justify-end">
          <Btn variant="gold" onClick={() => { set({ settings: f }); setToast("Pengaturan tersimpan"); }}>Simpan pengaturan</Btn>
        </div>
      </Card>

      <Card className="p-4">
        <h3 className="font-serif text-base">Data</h3>
        <p className="mt-1 text-sm text-indigo-950/55">
          Semua catatan tersimpan otomatis di perangkat ini. Unduh cadangan sebelum mengganti perangkat.
        </p>
        <div className="mt-3 flex flex-wrap gap-2">
          <Btn variant="outline" onClick={unduh}><Download size={15} /> Unduh cadangan</Btn>
          <Btn variant="danger" onClick={() => setKonfirmasi(true)}><Trash2 size={15} /> Kosongkan semua data</Btn>
        </div>
      </Card>

      <Modal
        open={konfirmasi}
        onClose={() => setKonfirmasi(false)}
        title="Kosongkan semua data?"
        sub="Katalog, pelanggan, dan riwayat transaksi akan hilang."
        footer={
          <>
            <Btn variant="ghost" onClick={() => setKonfirmasi(false)}>Batal</Btn>
            <Btn variant="danger" onClick={() => { set({ costumes: [], customers: [], rentals: [] }); setKonfirmasi(false); setToast("Data dikosongkan"); }}>
              Ya, kosongkan
            </Btn>
          </>
        }
      >
        <p className="text-sm text-indigo-950/70">
          Tindakan ini tidak bisa dibatalkan. Unduh cadangan dulu jika masih dibutuhkan.
        </p>
      </Modal>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>

<script>
(function () {
  function gagal(judul, detail) {
    var el = document.getElementById("root");
    if (!el) return;
    el.innerHTML = '<div id="pesan"><b></b><code></code></div>';
    el.querySelector("b").textContent = judul;
    el.querySelector("code").textContent = detail;
  }
  window.addEventListener("error", function (e) {
    gagal("Aplikasi berhenti", (e.message || "kesalahan tidak diketahui") + "\n" + (e.filename || ""));
  });

  // Tiga sumber cadangan: sebagian jaringan memblokir salah satunya.
  var pustaka = [
    { nama: "React", ada: function () { return !!window.React; }, url: [
      "https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js",
      "https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js",
      "https://unpkg.com/react@18.3.1/umd/react.production.min.js" ] },
    { nama: "ReactDOM", ada: function () { return !!window.ReactDOM; }, url: [
      "https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js",
      "https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js",
      "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" ] },
    { nama: "Babel", ada: function () { return !!window.Babel; }, url: [
      "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js",
      "https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js",
      "https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" ] }
  ];

  function ambil(p, selesai) {
    var i = 0;
    (function coba() {
      if (p.ada()) return selesai(true);
      if (i >= p.url.length) return selesai(false);
      var s = document.createElement("script");
      s.src = p.url[i++];
      s.onload = function () { p.ada() ? selesai(true) : coba(); };
      s.onerror = coba;
      document.head.appendChild(s);
    })();
  }

  (function berikutnya(n) {
    if (n >= pustaka.length) {
      try { window.Babel.transformScriptTags(); }
      catch (err) { gagal("Kode aplikasi bermasalah", String(err && err.message || err)); }
      return;
    }
    ambil(pustaka[n], function (ok) {
      if (!ok) return gagal(pustaka[n].nama + " tidak bisa diunduh",
        "Ketiga sumber cadangan gagal dihubungi.\n\nCoba matikan penghemat data atau VPN, ganti ke jaringan lain, lalu muat ulang halaman.");
      berikutnya(n + 1);
    });
  })(0);
})();
</script>
